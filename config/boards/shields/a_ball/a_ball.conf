# Turn on logging, and set ZMK logging to debug output
CONFIG_ZMK_USB_LOGGING=n
CONFIG_ZMK_SLEEP=y

# These are troubleshooting items
#CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
#CONFIG_ZMK_BLE_PASSKEY_ENTRY=n


CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_PMW3610_ALT=y

# Left-thumb  orientation by default.
#CONFIG_PMW3610_ALT_SWAP_XY=y
CONFIG_PMW3610_ALT_INVERT_X=y
#CONFIG_PMW3610_ALT_INVERT_Y=y

# CONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=12
#CONFIG_PMW3610_ALT_LOG_LEVEL_DBG=y
CONFIG_PMW3610_ALT_INIT_POWER_UP_EXTRA_DELAY_MS=2000
#// <--see Troubleshooting

# The sensor drops to a slower internal polling rate the longer the ball
# sits still (RUN -> REST1 -> REST2 -> REST3), independent of any BLE
# setting. Defaults downshift after just 128ms/5s/17s of stillness, so any
# normal pause (reading, aiming) makes the next movement feel laggy while
# it climbs back out. Loosened here so brief pauses don't cost responsiveness;
# battery life trade-off is minor since REST3 (slowest) is now much harder to reach.
CONFIG_PMW3610_ALT_RUN_DOWNSHIFT_TIME_MS=3264
CONFIG_PMW3610_ALT_REST1_DOWNSHIFT_TIME_MS=30000
CONFIG_PMW3610_ALT_REST2_DOWNSHIFT_TIME_MS=60000

# Downshifting itself is fine (power savings while the ball is genuinely
# still) - what matters is snapping back to full speed the instant it moves
# again. These control how often the sensor checks for motion while resting;
# defaults are 40/100/500ms, so REST3 in particular could take up to half a
# second to even notice you started moving. 20ms everywhere keeps that
# worst-case detection delay imperceptible.
CONFIG_PMW3610_ALT_REST1_SAMPLE_TIME_MS=20
CONFIG_PMW3610_ALT_REST2_SAMPLE_TIME_MS=20
CONFIG_PMW3610_ALT_REST3_SAMPLE_TIME_MS=20


# Set max number of BT connections
CONFIG_BT_MAX_CONN=3
CONFIG_BT_MAX_PAIRED=3


CONFIG_ZMK_KEYBOARD_NAME="Trackball v.4"